<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录测试</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .form-group { margin: 10px 0; }
        label { display: inline-block; width: 80px; }
        input { padding: 5px; width: 200px; }
        button { padding: 8px 16px; margin: 10px 0; }
        .result { margin-top: 20px; padding: 10px; background: #f5f5f5; white-space: pre-wrap; }
        .success { border-left: 4px solid #28a745; }
        .error { border-left: 4px solid #dc3545; }
    </style>
</head>
<body>
<h2>登录测试页面</h2>
<form id="loginForm">
    <div class="form-group">
        <label>用户名:</label>
        <input type="text" id="username" value="admin">
    </div>
    <div class="form-group">
        <label>密码:</label>
        <input type="password" id="password" value="password">
    </div>
    <button type="button" onclick="doLogin()">登录</button>
</form>

<div id="result" class="result" style="display: none;"></div>

<script>
    async function doLogin() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const resultDiv = document.getElementById('result');

        resultDiv.style.display = 'block';
        resultDiv.className = 'result';
        resultDiv.innerHTML = '发送请求中...';

        try {
            const response = await fetch('http://localhost:8080/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ username, password })
            });

            console.log('Response status:', response.status);
            console.log('Response headers:', response.headers);

            // 先读取响应文本
            const responseText = await response.text();
            console.log('Raw response:', responseText);

            let data;
            try {
                // 尝试解析为JSON
                data = JSON.parse(responseText);
            } catch (parseError) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                        ❌ JSON解析失败: ${parseError.message}
                        \n原始响应: ${responseText}
                        \n状态码: ${response.status}
                    `;
                return;
            }

            if (response.ok) {
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `
                        ✅ 请求成功!
                        \n状态码: ${response.status}
                        \n响应数据: ${JSON.stringify(data, null, 2)}
                        ${data.code === 200 ? `\n\n🎉 登录成功! Token: ${data.token.substring(0, 20)}...` : ''}
                    `;
            } else {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                        ❌ 请求失败
                        \n状态码: ${response.status}
                        \n响应数据: ${JSON.stringify(data, null, 2)}
                    `;
            }

        } catch (error) {
            resultDiv.className = 'result error';
            resultDiv.innerHTML = `
                    ❌ 网络请求失败: ${error.message}
                    \n请检查:
                    \n1. 后端服务是否运行在 localhost:8080
                    \n2. 控制台是否有错误信息
                    \n3. 网络连接是否正常
                `;
            console.error('Request failed:', error);
        }
    }
</script>
</body>
</html>
